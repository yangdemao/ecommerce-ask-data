# Text2SQL 评测题集
#
# 每条记录的 golden_sql 是该问题的标准答案 SQL，评测时以它的查询结果作为期望结果集。
# 结果的正确性只看「执行结果是否一致」，不要求模型生成与标准 SQL 写法相同的语句。
#
# 字段说明：
#   id         题号，报告里用来定位失败样例
#   question   用户自然语言问题
#   golden_sql 标准答案 SQL（不带分号）
#   difficulty easy / medium / hard
#   tags       考察点，用于分析模型在哪类问题上更容易出错
#
# 数据范围说明：示例数仓 dw 只包含 2025 年第一季度的订单数据，
# 因此题集中的时间条件都限定在这一范围内，避免出现恒为空的结果集。

- id: E01
  question: 统计华北地区的销售总额
  difficulty: easy
  tags: [多表关联, 值过滤]
  golden_sql: |
    SELECT SUM(f.order_amount) AS sales_amount
    FROM fact_order f
    JOIN dim_region r ON f.region_id = r.region_id
    WHERE r.region_name = '华北'

- id: E02
  question: 统计2025年第一季度各大区的GMV，并按GMV从高到低排序
  difficulty: medium
  tags: [指标口径, 时间过滤, 排序]
  golden_sql: |
    SELECT r.region_name, SUM(f.order_amount) AS gmv
    FROM fact_order f
    JOIN dim_region r ON f.region_id = r.region_id
    JOIN dim_date d ON f.date_id = d.date_id
    WHERE d.year = 2025 AND d.quarter = 'Q1'
    GROUP BY r.region_name
    ORDER BY gmv DESC

- id: E03
  question: 2025年3月各商品品类的销量和销售额
  difficulty: medium
  tags: [时间过滤, 分组聚合]
  golden_sql: |
    SELECT p.category, SUM(f.order_quantity) AS qty, SUM(f.order_amount) AS amt
    FROM fact_order f
    JOIN dim_product p ON f.product_id = p.product_id
    JOIN dim_date d ON f.date_id = d.date_id
    WHERE d.year = 2025 AND d.month = 3
    GROUP BY p.category

- id: E04
  question: 华南地区2025年第一季度销售总额最高的前5个商品
  difficulty: hard
  tags: [四表关联, 时间过滤, TopN]
  golden_sql: |
    SELECT p.product_name, SUM(f.order_amount) AS amt
    FROM fact_order f
    JOIN dim_product p ON f.product_id = p.product_id
    JOIN dim_region r ON f.region_id = r.region_id
    JOIN dim_date d ON f.date_id = d.date_id
    WHERE r.region_name = '华南' AND d.year = 2025 AND d.quarter = 'Q1'
    GROUP BY p.product_name
    ORDER BY amt DESC
    LIMIT 5

- id: E05
  question: 按会员等级统计2025年第一季度的订单数和销售总额
  difficulty: medium
  tags: [时间过滤, 分组聚合, 计数]
  golden_sql: |
    SELECT c.member_level, COUNT(*) AS order_cnt, SUM(f.order_amount) AS amt
    FROM fact_order f
    JOIN dim_customer c ON f.customer_id = c.customer_id
    JOIN dim_date d ON f.date_id = d.date_id
    WHERE d.year = 2025 AND d.quarter = 'Q1'
    GROUP BY c.member_level

